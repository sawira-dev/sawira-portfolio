<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient (navy) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1730" />
      <stop offset="100%" stop-color="#050d1f" />
    </linearGradient>

    <!-- Blue-to-cyan gradient for "M" -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Soft blue glow behind the ring -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)" />

  <!-- Background circle (avatar disc) -->
  <circle cx="32" cy="32" r="26" fill="url(#bg)" />

  <!-- Border ring -->
  <circle
    cx="32"
    cy="32"
    r="26"
    fill="none"
    stroke="#60a5fa"
    stroke-width="1.6"
    stroke-opacity="0.85"
  />

  <!-- Orbiting dot at top of ring -->
  <circle cx="32" cy="6" r="3" fill="#22d3ee" />
  <circle cx="32" cy="6" r="3" fill="#22d3ee" opacity="0.4">
    <animate
      attributeName="r"
      values="3;7;3"
      dur="2s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="0.5;0;0.5"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- "S" -->
  <text
    x="24"
    y="40"
    font-family="'Playfair Display', Georgia, serif"
    font-size="26"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
  >S</text>

  <!-- "M" (italic, gradient) -->
  <text
    x="42"
    y="40"
    font-family="'Playfair Display', Georgia, serif"
    font-size="26"
    font-weight="800"
    font-style="italic"
    fill="url(#accent)"
    text-anchor="middle"
  >M</text>
</svg>